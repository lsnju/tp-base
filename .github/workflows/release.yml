name: Publish V2 to Maven

on:
  push:
    tags:
      - 'v2*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      # Maven 3.10+ writes maven-metadata-local.xml into the staging repo; Central
      # rejects the bundle unless central-publishing-maven-plugin >= 0.12.0 is used.
      - name: Set up Maven
        uses: stCarolas/setup-maven@v7
        with:
          maven-version: 3.9.9

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        run: |
          install -d -m 700 "${HOME}/.gnupg"
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

      - name: Build, test, and publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        run: |
          mvn --batch-mode --no-transfer-progress --show-version \
            -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" \
            -Dgpg.arg="--pinentry-mode loopback" \
            clean deploy
