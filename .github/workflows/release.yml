name: Publish V2 to Maven

on:
  push:
    tags:
      - 'v2*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Verify tag matches POM version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(mvn --batch-mode --no-transfer-progress \
            help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Git tag v${TAG} does not match pom.xml version ${VERSION}"
            exit 1
          fi
          echo "Release version: ${VERSION}"

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        run: |
          install -d -m 700 "${HOME}/.gnupg"
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

      - name: Build, test, and publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        run: |
          mvn --batch-mode --no-transfer-progress --show-version \
            -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" \
            -Dgpg.arg="--pinentry-mode loopback" \
            clean deploy
